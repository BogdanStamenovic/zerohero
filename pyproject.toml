[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zerohero"
version = "0.1.0"
description = "Air guitar and air piano from a webcam: type chords, play them with your hands"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Bogdan Stamenovic", email = "bogdan.stamenovic@gmail.com" }]
dependencies = [
    "mediapipe>=0.10.14,<1",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "pyfluidsynth>=1.3",
    "sounddevice>=0.4.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
zerohero = "zerohero.cli:main"

[project.urls]
Homepage = "https://github.com/BogdanStamenovic/zerohero"

[tool.hatch.build.targets.wheel]
packages = ["src/zerohero"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
